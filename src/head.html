<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1622">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baseball Go">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Baseball Go</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --night:#0B1622; --panel:#13222F; --panel-2:#1A2D3D; --line:#26405A;
  --chalk:#EEF1E6; --muted:#93A6B6; --ball:#D3E86B; --ball-ink:#2B3A06;
  --win:#74D493; --loss:#F28A78; --dirt:#B98458; --grass:#5E9A3A;
  --display:'Saira Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
[hidden]{display:none!important}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:10px 14px;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ball);outline-offset:2px}
button.go{background:var(--ball);color:var(--ball-ink);border-color:var(--ball);font-family:var(--display);font-size:20px;letter-spacing:.04em;text-transform:uppercase;padding:12px 18px}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:default}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--muted);margin:0}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;line-height:1.05;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(48px,15vw,76px);text-transform:uppercase}
h2{font-size:28px;text-transform:uppercase}
h3{font-size:20px;text-transform:uppercase}
p{margin:0}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.s-hard{background:var(--hard)}.s-clay{background:var(--clay)}.s-grass{background:var(--grass)}
.num{font-variant-numeric:tabular-nums}
label{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
select{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.hero{display:flex;flex-direction:column;gap:10px;padding-block:12px 4px}
.hero h1 span{color:var(--ball)}
.how{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}
.how b{font-family:var(--display);font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--ball)}
.stepper{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.step{border-top:4px solid var(--line);padding-top:6px;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:15px;color:var(--muted)}
.step.done{border-color:var(--muted)}
.step.now{border-color:var(--ball);color:var(--chalk)}
.stat{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ball);border-radius:4px}
.stat button{padding:5px 10px;font-size:13px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{display:flex;flex-direction:column}
.kv small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.kv strong{font-family:var(--display);font-size:24px;font-weight:700}
.cal ul{list-style:none;margin:0;padding:0}
.cal li{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:15px;min-width:0}
.cal li:first-child{border-top:0}
.res{font-family:var(--display);font-weight:700;letter-spacing:.05em;font-size:15px}
.res.w{color:var(--win)}.res.next{color:var(--ball)}.res.up{color:var(--muted)}
.cal li.is-next{font-weight:600}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slot{border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.slot.won{border-style:solid;border-color:var(--ball);color:var(--chalk)}
.slot strong{font-family:var(--display);font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.offer{display:flex;flex-direction:column;gap:6px;text-align:left;font-weight:400}
.offer strong{font-family:var(--display);font-size:22px;text-transform:uppercase}
/* roster */
.roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pc{display:flex;flex-direction:column;gap:6px;text-align:left;font-weight:400;padding:12px;border-radius:12px;min-width:0}
.pc[aria-pressed=true]{border-color:var(--ball);box-shadow:0 0 0 1px var(--ball) inset}
.pc strong{font-family:var(--display);font-size:20px;text-transform:uppercase;line-height:1.1}
.pc small{color:var(--muted);font-size:13px;line-height:1.3}
.mini{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center;font-size:12px;color:var(--muted)}
.mini .bar{height:5px}
.sticky{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--night) 30%)}
/* career extras */
.note{font-size:14px;color:var(--chalk);background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.opp{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.stgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;margin:4px 0}.stgrid div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:4px 0;font-size:14px}.stgrid small{color:var(--muted)}.stgrid strong{font-size:15px}
.wkpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:6px}
.wkpick .pc{padding:10px;gap:2px}.wkpick .pc strong{font-size:15px;line-height:1.2}.wkpick .pc small{font-size:12px}
.ftab{width:100%;border-collapse:collapse;font-size:14px}.ftab th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:4px 2px;border-bottom:1px solid var(--line)}
.ftab th:not(:first-child),.ftab td:not(:first-child){text-align:right;width:52px}.ftab td{padding:5px 2px;border-bottom:1px solid var(--line)}.ftab tr.me td{color:var(--ball);font-weight:600}.ftab tr.q td:first-child{box-shadow:inset 3px 0 0 var(--win);padding-left:8px}
.quote{font-style:italic;font-size:15px}
ol.perks{margin:4px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
ol.perks .muted{display:inline-block;min-width:54px;font-family:var(--display);text-transform:uppercase;letter-spacing:.05em}
.perklist{list-style:none;margin:-4px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.perklist li{display:grid;grid-template-columns:62px 1fr;gap:8px}
.perklist li span{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em}
.perklist li.on{color:var(--chalk)}.perklist li.on span{color:var(--win)}
/* match */
#match{position:fixed;inset:0;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;background:#0B1622}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:0;right:0;pointer-events:none;padding-inline:10px}
.hud.top{top:calc(env(safe-area-inset-top,0px) + 8px)}
.hud.bot{bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;flex-direction:column;gap:6px;align-items:center}
.board{max-width:480px;margin:0 auto;background:rgba(5,12,20,.86);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-family:var(--display)}
.board .lab{display:flex;justify-content:space-between;padding:4px 12px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.brow{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;padding:5px 12px;font-size:19px;font-weight:700}
.brow + .brow{border-top:1px solid #16283A}
.brow{position:relative}.brow .en{position:absolute;left:34px;right:72px;bottom:2px;height:3px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}.brow .en i{display:block;height:100%;width:100%;background:#74D493;transition:width .3s}
.brow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brow .sets{display:flex;gap:8px;color:var(--muted)}
.brow .sets span.cur{color:var(--chalk)}
.brow .pt{min-width:44px;text-align:center;background:var(--ball);color:var(--ball-ink);border-radius:6px;padding:0 6px}
.srv{width:9px;height:9px;border-radius:50%;background:var(--ball);visibility:hidden}
.srv.on{visibility:visible}
#svType{display:flex;gap:6px;pointer-events:auto}#svType[hidden]{display:none}#svType button{padding:6px 14px;font-size:14px;background:rgba(5,12,20,.82);font-family:var(--display);letter-spacing:.06em;text-transform:uppercase}#svType button[aria-pressed=true]{background:var(--ball);color:var(--ball-ink);border-color:var(--ball)}
#hint{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--chalk);text-shadow:0 1px 3px rgba(0,0,0,.8);text-align:center}
#hint.warn{color:var(--loss)}
#power{width:min(260px,70vw);height:12px;border-radius:6px;background:rgba(5,12,20,.8);border:1px solid var(--line);overflow:hidden;position:relative}
#power i{position:absolute;left:0;top:0;bottom:0;background:var(--ball);width:0}
#power b{position:absolute;top:0;bottom:0;left:68%;right:0;background:rgba(242,138,120,.3)}
.msgbar{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(5,12,20,.78);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;pointer-events:auto}
#msg{font-size:15px;font-weight:600;min-width:0}
#quit,#snd{padding:6px 12px;font-size:13px;flex:none}
#call{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:var(--display);font-weight:800;font-size:56px;letter-spacing:.04em;color:var(--chalk);text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .25s}
#call.on{opacity:1}
.drillp{max-width:480px;margin:0 auto;background:rgba(5,12,20,.88);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.35}
.drillp .eyebrow{color:var(--ball)}
.dots{display:flex;gap:6px;flex-wrap:wrap}.dots i{width:22px;height:8px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line)}.dots i.on{background:var(--ball);border-color:var(--ball)}
#dDone{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,12,20,.45)}
#dDone .card{max-width:380px;width:100%;pointer-events:auto}
.lesson{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.lesson strong{font-family:var(--display);font-size:20px;text-transform:uppercase}
.lesson.done{border-color:#2f5a3d}
.tip{font-size:15px}
.seed{display:inline-block;min-width:18px;margin-right:5px;padding:0 4px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);font-size:11px;text-align:center;color:var(--ball);font-weight:700}
.nat{font-size:11px;color:var(--muted);letter-spacing:.06em}
.dr-scroll{overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.dr-grid{display:flex;gap:12px;min-width:max-content;padding:0 4px}
.dr-col{display:flex;flex-direction:column;width:212px;flex:none}
.dr-col .eyebrow{margin-bottom:6px}
.dr-ms{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:8px;min-height:calc(var(--n) * 66px)}
.dr-m{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dr-m.mine{border-color:var(--ball);box-shadow:0 0 0 1px var(--ball) inset}
.dr-m.champ{border-color:#6b5a1c}
.dr-p{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 8px;font-size:12.5px;min-height:27px}
.dr-p+.dr-p{border-top:1px solid var(--line)}
.dr-p span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dr-p.w{font-weight:700}.dr-p.l{color:var(--muted)}.dr-p.me span{color:var(--ball)}
.dr-p small.num{color:var(--muted);font-size:11px;flex:none}
.rk-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rk{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.rk b{font-family:var(--display);font-size:20px;color:var(--muted)}
.rk span{min-width:0;font-weight:600}.rk small.num{color:var(--muted);font-size:12px}
.rk.me{border-color:var(--ball);box-shadow:0 0 0 1px var(--ball) inset}.rk.me b,.rk.me span{color:var(--ball)}
.rk.rv{border-color:#6b2f2f}
.rk-gap{text-align:center;color:var(--muted);letter-spacing:.3em}
.board{pointer-events:auto;-webkit-touch-callout:none;user-select:none}
#tunePanel{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,12,20,.6)}
#tunePanel[hidden]{display:none}
#pauseMenu{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,12,20,.72)}
#pauseMenu[hidden]{display:none}#pauseMenu .card{max-width:380px;width:100%}
#tunePanel .card{max-width:440px;width:100%;max-height:calc(100vh - 32px);overflow:auto}
.trow{display:flex;flex-direction:column;gap:4px;color:var(--chalk)}.trow span{display:flex;justify-content:space-between;gap:10px}.trow b{font-weight:600}
.trow output{color:var(--ball);font-variant-numeric:tabular-nums}.trow small{color:var(--muted);font-size:12px}
.trow input{width:100%;accent-color:#D3E86B}
#tMsg:empty{display:none}
.pc.locked{opacity:.45}.pc.locked strong{color:var(--muted)}
.gearb{color:var(--win);font-family:var(--body);font-size:12px;font-weight:600}
.xpbar{height:10px}.xpbar i{background:linear-gradient(90deg,#9BE15D,var(--ball))}
.coin{background:#3a3110;border-color:#6b5a1c;color:#F5D36B}
.rewards{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.rewards .lvl{font-family:var(--display);font-size:22px;text-transform:uppercase}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.notes li{padding:6px 10px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line)}
.notes .n-lvl,.notes .n-unlock{border-color:var(--ball);color:var(--ball)}.notes .n-ach{border-color:#6b5a1c;color:#F5D36B}.notes .n-daily{border-color:#2f5a3d;color:var(--win)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.tabs button{flex:none;padding:8px 12px;font-size:14px}.tabs button[aria-pressed=true]{background:var(--ball);color:var(--ball-ink);border-color:var(--ball)}
.lk-item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lk-item strong{font-size:16px}.lk-item .bar{margin-top:6px}.lk-item.done{border-color:#2f5a3d}
.lk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lk-p{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.lk-p small{color:var(--muted);font-size:12px}.lk-p.locked{opacity:.6}.lk-p button{padding:6px 10px;font-size:13px;margin-top:4px}
.pips{display:flex;gap:3px;margin-top:6px}.pips i{flex:1;height:6px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line)}.pips i.on{background:var(--ball);border-color:var(--ball)}
.pips.sm i{height:5px}
.sw{display:block;height:14px;border-radius:7px;border:1px solid rgba(255,255,255,.25)}.tip b{display:block;font-family:var(--display);font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--ball)}.lesson.done .eyebrow{color:var(--win)}
#replay{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 96px);display:flex;align-items:center;gap:8px;background:rgba(5,12,20,.86);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
#replay i{width:10px;height:10px;border-radius:50%;background:#F28A78;animation:blink 1s steps(2) infinite}
#replay small{font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted)}
@keyframes blink{50%{opacity:.2}}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--night);font-family:var(--display);font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.score-line{font-family:var(--display);font-size:46px;font-weight:800;line-height:1}
.banner{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:18px;letter-spacing:.1em}
.banner.w{color:var(--win)}.banner.l{color:var(--loss)}
textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:13px/1.4 ui-monospace,Menlo,monospace;color:var(--chalk);resize:vertical;word-break:break-all}
#saveMsg:empty{display:none}

/* baseball */
.ovr{display:flex;flex-direction:column;align-items:center;background:var(--ball);color:var(--ball-ink);border-radius:12px;padding:4px 12px;flex:none}
.ovr small{font-family:var(--display);font-weight:700;letter-spacing:.1em;font-size:12px}.ovr b{font-family:var(--display);font-size:30px;line-height:1}
.stat{grid-template-columns:72px 1fr 28px auto}.stat .sv{font-family:var(--display);font-size:16px;text-align:right}
.toggle{flex-direction:row;align-items:flex-start;gap:10px;color:var(--chalk);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px}
.toggle input{width:22px;height:22px;flex:none;accent-color:#D3E86B;margin-top:2px}
.list{display:flex;flex-direction:column;gap:8px}
.big{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.15}
.tw{color:var(--win)}.tl{color:var(--loss)}.res.l{color:var(--loss)}
.plays{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px;max-height:40vh;overflow:auto}
.plays li{padding:4px 8px;border-radius:8px;background:var(--panel-2)}.plays li.me{color:var(--ball);font-weight:600}.plays li.h{background:none;color:var(--muted);font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:12px;padding:6px 0 0}
.lsw{overflow-x:auto}.ls{border-collapse:collapse;font-size:14px;width:100%;font-variant-numeric:tabular-nums}.ls th,.ls td{padding:4px 5px;text-align:center;border-bottom:1px solid var(--line)}.ls td:first-child,.ls th:first-child{text-align:left;font-weight:700}.ls tr.me td{color:var(--ball)}.ls th{color:var(--muted);font-weight:600;font-size:12px}
.ftab.rec th:not(:first-child),.ftab.rec td:not(:first-child){width:auto}
/* at-bat HUD */
#ab{position:fixed;inset:0;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;background:#0B1622}
#ab .hud.top{display:flex;flex-direction:column;gap:4px;align-items:center}
.bug{display:flex;gap:0;max-width:420px;width:100%;background:rgba(5,12,20,.86);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-family:var(--display);pointer-events:none}
.bug .bl{flex:1;display:flex;flex-direction:column;padding:4px 12px;min-width:0}
.bug .tm{display:flex;justify-content:space-between;gap:10px;font-size:19px;font-weight:700}.bug .tm b{color:var(--ball)}
.bug .bm{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 12px;border-left:1px solid var(--line);font-size:15px;font-weight:700}
.dia{width:40px;height:28px}.dia rect{fill:none;stroke:var(--muted);stroke-width:1.6}.dia rect.on{fill:var(--ball);stroke:var(--ball)}
.outs{display:flex;gap:4px}.outs i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted)}.outs i.on{background:var(--loss);border-color:var(--loss)}
.sub{max-width:420px;width:100%;font-size:13px;color:var(--chalk);text-shadow:0 1px 3px rgba(0,0,0,.8);padding:0 4px}
.cnt{font-family:var(--display);font-size:22px;font-weight:800;background:rgba(5,12,20,.8);border:1px solid var(--line);border-radius:8px;padding:0 10px}.cnt b{font-weight:800}
#ptype{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 2px 6px rgba(0,0,0,.8);margin-top:4px}
#call{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--display);font-weight:800;font-size:52px;letter-spacing:.04em;text-transform:uppercase;color:var(--chalk);text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .25s}
#aimBtn{pointer-events:auto;padding:4px 10px;font-size:13px;background:rgba(5,12,20,.82);font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;border-color:var(--ball);color:var(--ball)}
.lcol{display:flex;flex-direction:column;gap:6px;pointer-events:none}
#meters{display:flex;gap:6px;pointer-events:auto}
#meters button{display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:5px 10px;background:rgba(5,12,20,.86);font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;min-width:96px;touch-action:none}
#meters button:disabled{opacity:.75}
#turboBtn .pips{display:flex;gap:3px}#turboBtn .pips i{flex:1;height:7px;border-radius:3px;background:linear-gradient(90deg,#FF7A1A calc(var(--f)*100%),rgba(255,255,255,.12) 0)}
#turboBtn.armed{border-color:#FF7A1A;background:rgba(255,122,26,.3);box-shadow:0 0 14px #FF7A1A}
#blastBtn b{display:block;height:7px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}#blastBtn b i{display:block;height:100%;width:0;background:linear-gradient(90deg,#F2C230,#FF4D4D)}
#blastBtn.ready{border-color:#F2C230;color:#F2C230;animation:pulse 0.8s ease-in-out infinite}#blastBtn.armed{background:rgba(242,194,48,.35);border-color:#F2C230;box-shadow:0 0 18px #F2C230}
@keyframes pulse{50%{box-shadow:0 0 18px #F2C230;transform:scale(1.05)}}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0}#flash.on{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.7}100%{opacity:0}}
#fire{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 108px);padding:3px 10px;border-radius:8px;background:linear-gradient(90deg,#FF4D1A,#F2C230);color:#2B1200;font-family:var(--display);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:15px;pointer-events:none;animation:pulse 1s infinite}
#settings{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,12,20,.8)}
#settings .card{max-width:460px;width:100%;max-height:calc(100vh - 32px);overflow:auto}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.setrow>span{display:flex;flex-direction:column;font-weight:600;min-width:0;flex:1 1 150px}.setrow small{color:var(--muted);font-weight:400;font-size:12px}
.seg{display:flex;gap:4px;align-items:center}.seg button{padding:6px 10px;font-size:13px}.seg button[aria-pressed=true]{background:var(--ball);color:var(--ball-ink);border-color:var(--ball)}
#calib{position:fixed;inset:0;z-index:70;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;touch-action:none;user-select:none}
#calDot{width:120px;height:120px;border-radius:50%;border:4px solid var(--ball)}#calDot.hit{animation:beat .35s ease-out}#calDot.tap{background:rgba(211,232,107,.35)}
@keyframes beat{0%{background:var(--ball);transform:scale(1.15)}100%{background:transparent;transform:scale(1)}}
#dbg{position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 136px);text-align:center;font:12px ui-monospace,Menlo,monospace;color:#9FE;text-shadow:0 1px 2px #000;pointer-events:none}
#replayTag{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 108px);display:flex;align-items:center;gap:8px;background:rgba(5,12,20,.86);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
#replayTag i{width:10px;height:10px;border-radius:50%;background:#F28A78;animation:blink 1s steps(2) infinite}#replayTag small{font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted)}
#ab.mode #meters{display:none}
#pitchBar{display:none;gap:6px;flex-wrap:wrap;pointer-events:auto}#ab.pitching #pitchBar{display:flex}#ab.pitching #stype,#ab.pitching #blastBtn,#ab.pitching #aimBtn{display:none}
#pitchBar button{padding:6px 12px;font-size:14px;background:rgba(5,12,20,.82);font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;border-color:var(--pc)}#pitchBar button[aria-pressed=true]{background:var(--pc);color:#10202B}
#pmeter{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 150px);width:min(300px,80vw);height:22px;border-radius:11px;background:rgba(5,12,20,.88);border:2px solid var(--line);overflow:hidden;pointer-events:none}
#pmGreen{position:absolute;top:0;bottom:0;background:#74D493}#pmRed{position:absolute;top:0;bottom:0;left:93%;right:0;background:#F28A78}#pmNeedle{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 6px #fff}
#qte{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:20;padding:18px 34px;border-radius:16px;background:#F2C230;color:#2B1200;border:3px solid #fff;font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.08em;animation:pulse .5s infinite;touch-action:none}
#stealBtn{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 250px);z-index:5;padding:8px 14px;background:rgba(5,12,20,.86);border-color:#4CA3FF;color:#4CA3FF;font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;touch-action:none}
#ab.rp .ctl,#ab.rp #grades{visibility:hidden}
#modeEnd{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,12,20,.7)}#modeEnd .card{max-width:380px;width:100%;text-align:center}
#grades{position:absolute;left:0;right:0;top:calc(34% + 64px);display:flex;justify-content:center;gap:8px;pointer-events:none;opacity:0;transition:opacity .2s}
#grades.on{opacity:1}
.gr{display:flex;flex-direction:column;align-items:center;min-width:104px;padding:4px 12px;border-radius:10px;background:rgba(5,12,20,.86);border:1px solid var(--line);font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.gr small{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.gr.g{color:#9BE15D;border-color:#9BE15D}.gr.g2{color:var(--ball)}.gr.m{color:#F5A524}.gr.b{color:var(--loss)}
#call.on{opacity:1}#call.w{color:var(--ball)}#call.l{color:var(--chalk)}
.ctl{width:100%;max-width:480px;align-items:flex-end}
#stype{display:flex;gap:6px;pointer-events:auto}#stype button{padding:6px 12px;font-size:14px;background:rgba(5,12,20,.82);font-family:var(--display);letter-spacing:.06em;text-transform:uppercase}#stype button[aria-pressed=true]{background:var(--ball);color:var(--ball-ink);border-color:var(--ball)}
#swingBtn{pointer-events:auto;width:86px;height:86px;border-radius:50%;background:rgba(211,232,107,.22);border:2px solid var(--ball);color:var(--chalk);font-family:var(--display);font-size:20px;letter-spacing:.06em;text-transform:uppercase;touch-action:none}
#swingBtn:active{background:rgba(211,232,107,.5)}
#between{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,12,20,.55)}
#between .card{max-width:440px;width:100%;max-height:calc(100vh - 32px);overflow:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
